server.port=8844

server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

di.saml.pages.success=/
di.saml.pages.nonsecured=/,/discovery,/manage/**,/error,/webjars/**,/login,/login/**,/css/**,/js/**,/img/**,/favicon.ico,/api/**,/ops/**,/kontroller
# allow inlining brugertjek in portals
di.saml.pages.xFrameOptionsDisabled=true

management.endpoints.web.base-path=/manage

server.servlet.session.persistent=true
server.servlet.session.cookie.max-age=36000
server.servlet.session.timeout=10h

spring.jpa.open-in-view=false

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# disable monitoring, does not make sense in multi-tenant mode
framework.ad.disableMonitoring=true

server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
