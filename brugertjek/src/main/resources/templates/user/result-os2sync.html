<div th:fragment="result">
    <div class="validation-status" id="os2syncValidationStatus">
        <div th:each="validation : ${validations}" th:class="'alert ' + 'alert-' + ${validation.status} " role="alert">
            <div id="os2syncResult" th:data-result="${validation.status}">
                <span th:text="${validation.name}"></span>
                <span th:text="${validation.message}" style="white-space: pre-line"></span>
            </div>
        </div>
    </div>
    <div class="validation-data">
        <div class="panel-body">
            <div th:if="${user != null}" class="form-horizontal" th:object="${user}">
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">UUID</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{uuid}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Bruger-ID</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{userId}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Navn</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{person?.name}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Mobil</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{phoneNumber}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Fastnet</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{landline}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">E-mail</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{email}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">KMD Bruger-ID</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{racfID}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Lokation</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{location}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">FMK ID</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{fMKID}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Status (1 = Aktiv)</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <input class="form-control" type="text" readonly="readonly" th:value="*{status}"/>
                    </div>
                </div>
                <div class="form-group row">
                    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Tilhørsforhold</label>
                    <div class="col-sm-8 col-md-8 col-lg-9">
                        <table class="table table-bordered table-striped">
                          <thead>
                            <tr>
                              <th>Navn</th>
                              <th>Enheds UUID</th>
                              <th>Start dato</th>
                              <th>Slut dato</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr th:each="position : *{positions}">
                              <td th:text="${position.name}"></td>
                              <td th:text="${position.orgUnitUuid}"></td>
                              <td th:text="${#temporals.format(position.startDate, 'dd/MM-yyyy')}"></td>
                              <td th:text="${#temporals.format(position.stopDate, 'dd/MM-yyyy')}"></td>
                            </tr>
                          </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
