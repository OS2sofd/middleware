<div th:fragment="result">
    <div class="validation-status" id="nexusValidationStatus">
        <div th:each="validation : ${validations}" th:class="'alert ' + 'alert-' + ${validation.status} " role="alert">
            <div id="nexusResult" th:data-result="${validation.status}">
                <span th:text="${validation.name}"></span>
                <span th:text="${validation.message}" style="white-space: pre-line"></span>
            </div>
        </div>
    </div>

    <div class="validation-data">
        <div class="panel-body">
            <div th:if="${employee != null}" class="form-horizontal" th:object="${employee}">
				<div class="form-group row">
				    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Nexus ID</label>
				    <div class="col-sm-8 col-md-8 col-lg-9">
				        <input class="form-control" type="text" readonly="readonly" th:value="*{nexusId}"/>
				    </div>
				</div>

				<div class="form-group row">
				    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">NexusSync Status</label>
				    <div class="col-sm-8 col-md-8 col-lg-9">
				        <input class="form-control" type="text" readonly="readonly" th:value="*{nexusSyncStatus}"/>
				    </div>
				</div>

				<div class="form-group row">
				    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">KMD Identity ID</label>
				    <div class="col-sm-8 col-md-8 col-lg-9">
				        <input class="form-control" type="text" readonly="readonly" th:value="*{identityId}"/>
				    </div>
				</div>

				<div class="form-group row">
				    <label class="col-sm-4 col-md-4 col-lg-3 col-form-label">Aktiv i KMD Nexus</label>
					<div class="col-sm-8 col-md-8 col-lg-9">
					    <span th:if="*{active}" class="form-control-static" style="vertical-align: -webkit-baseline-middle;"><em class="fa fa-check"></em></span>
					</div>
				</div>
            </div>
        </div>
    </div>
</div>
