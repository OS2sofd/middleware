<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header (checkbox = true)}"></head>
<body class="top-navigation">
    <div id="wrapper">

            <div th:replace="~{fragments/topbar :: topbar(page = 'admin.search')}"></div>

            <div class="wrapper wrapper-content">

                    <div class="col-md-12 col-lg-8 offset-lg-2">

											Tillad bruger-logon
										</label>
										<div class="col-sm-8">

										</div>
									</div>

                                    <div class="form-group row">
                                        <div class="col-sm-12 text-center">
                                            <button class="btn btn-primary btn-block" type="submit" onclick="javascript:;">Gem</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/footer :: scripts (checkbox = true)}"></div>

</html>
