<!DOCTYPE html>
<html>
<body>
    <div th:fragment="scripts">
        <!-- minimum set of script files - always required -->
        <script th:src="@{/webjars/inspinia/2.9.3/js/jquery-3.1.1.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/steps/jquery.steps.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/popper.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/bootstrap.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/metisMenu/jquery.metisMenu.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/slimscroll/jquery.slimscroll.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/inspinia.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/pace/pace.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/sweetalert/sweetalert.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/toastr/toastr.min.js}"></script>
        <script>
            toastr.options = {
                "positionClass": "toast-top-right toastr-buffer"
            }
        </script>

        <th:block th:if="${checkbox == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/iCheck/icheck.min.js}"></script>
        <script>
            $(document).ready(function () {
                $('.i-checks').iCheck({
                    checkboxClass: 'icheckbox_square-green',
                    radioClass: 'iradio_square-green',
                });
            });
        </script>
        </th:block>

        <th:block th:if="${tabs == true}">
            <script>
                $(document).ready(function () {
                    // on load of the page: switch to the currently selected tab
                    var hash = window.location.hash;
                    $('.rememberPosition a[href="' + hash + '"]').tab('show');
                });

                $('.rememberPosition a').click(function(e) {
                    e.preventDefault();
                    $(this).tab('show');
                });

                // store the currently selected tab in the hash value
                $("ul.rememberPosition > li > a").on("shown.bs.tab", function(e) {
                    var id = $(e.target).attr("href").substr(1);
                    window.location.hash = id;
                    window.scrollTo(0, 0); // Prevent scroll to tab
                });
            </script>
        </th:block>
        
        <th:block th:if="${datatables == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/dataTables/datatables.min.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/dataTables/dataTables.bootstrap4.min.js}"></script>
        </th:block>
        
        <th:block th:if="${jstree == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/jsTree/jstree.min.js}"></script>
        </th:block>
        
        <th:block th:if="${texteditor == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/summernote/summernote-bs4.js}"></script>
        </th:block>
        
        <th:block th:if="${slider == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/ionRangeSlider/ion.rangeSlider.min.js}"></script>
        </th:block>
        
        <th:block th:if="${chart == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/sparkline/jquery.sparkline.min.js}"></script>
        </th:block>

        <th:block th:if="${codemirror == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/codemirror/codemirror.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/codemirror/mode/javascript/javascript.js}"></script>
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/codemirror/mode/xml/xml.js}"></script>
        </th:block>
        
        <th:block th:if="${select2 == true}">
        <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/select2/select2.full.min.js}"></script>
        </th:block>

        <th:block th:if="${fileInput == true}">
            <script type="text/javascript" th:src="@{/js/bs-custom-file-input.min.js}"></script>
        </th:block>

        <th:block th:if="${datepicker == true}">
            <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/datapicker/bootstrap-datepicker.js}"></script>
            <script type="text/javascript" th:src="@{/js/bootstrap-datepicker.da.js}"></script>
        </th:block>

        <th:block th:if="${datetimepicker == true}">
<!--             <script th:src="@{/webjars/momentjs/2.10.3/min/moment-with-locales.min.js}"></script> -->
<!--            <script th:src="@{/webjars/Eonasdan-bootstrap-datetimepicker/4.17.49/js/bootstrap-datetimepicker.js}"></script> -->
            <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.0/moment.min.js"></script>
            <script>
                // has to happen before datepicker script is loaded
                moment.locale('da');
            </script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.39.0/js/tempusdominus-bootstrap-4.min.js" integrity="sha512-k6/Bkb8Fxf/c1Tkyl39yJwcOZ1P4cRrJu77p83zJjN2Z55prbFHxPs9vN7q3l3+tSMGPDdoH51AEU8Vgo1cgAA==" crossorigin="anonymous"></script>
        </th:block>

        <th:block th:if="${moment == true}">
            <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/fullcalendar/moment.min.js}"></script>
        </th:block>

        <th:block th:if="${leaflet == true}">
            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        </th:block>

        <th:block th:if="${dropzone == true}">
            <script th:src="@{/webjars/inspinia/2.9.3/js/plugins/dropzone/dropzone.js}"></script>
        </th:block>
        
        <script>
        (function ($) {
            $.fn.getThen = function (url, params) {
                if (this.length <= 0) {
                    return jQuery.Deferred().resolveWith(this, ['']);
                }

                return jQuery.ajax({
                    url: url,
                    type: "GET",
                    dataType: "html",
                    data: params
                }).then(function (responseText) {
                    return jQuery.parseHTML(responseText);
                });
            };
        }(jQuery));
        </script>
        
    </div>
    
    <div class="footer fixed" th:fragment="footer">
        <div class="float-right text-center align-middle"><strong><span class="no-p-wrap">Digital Identity</span></strong></div>
    </div>
</body>
</html>
