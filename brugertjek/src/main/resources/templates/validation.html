<!DOCTYPE html>
<html>
<head th:replace="~{fragments/header :: header(checkbox = true, datatables = true)}"></head>

                                </div>
                            </div>

<!--                                         loaded in javascript -->

                    </div>

            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: scripts(checkbox = true, datatables = true)}"></div>
    <div th:replace="~{fragments/datatables :: datatables}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <style>
        .alert-success span:last-child {
            float: right;
        }
    
        .alert-success span:first-child {
            float: left;
        }
    
        .alert-success > div:after {
            clear: both;
            content: '';
            display: table;
        }
		
	    .alert-warning span:last-child {
	        float: right;
	    }

	    .alert-warning span:first-child {
	        float: left;
	    }

	    .alert-warning > div:after {
	        clear: both;
	        content: '';
	        display: table;
	    }

		.alert-danger span:last-child {
		    float: right;
		}

		.alert-danger span:first-child {
		    float: left;
		}

		.alert-danger > div:after {
		    clear: both;
		    content: '';
		    display: table;
		}
		
        .skeleton-text {
            display: inline-block;
            min-width: 120px;
            width: 100%;
            height: 0.7rem;
            margin-bottom: 0.5rem;
            border-radius: 0.25rem;
            border: 10px solid lightgray;
            background-color: lightgray;
            color: lightgray;
        }
    </style>

    <script th:inline="javascript">
    
    /*<![CDATA[*/
    /*[+
    	var adEnabled = [[${adEnabled}]];
    	var sofdEnabled = [[${sofdEnabled}]];
    	var nexusEnabled = [[${nexusEnabled}]];
    	var rcEnabled = [[${rcEnabled}]];
    	var os2faktorEnabled = [[${os2faktorEnabled}]];
    	var entraEnabled = [[${entraEnabled}]];
    	
    	var findUserIdFirst = [[${findUserIdFirst}]];
	+]*/

        $(document).ready(function () {
        	
        	if (sofdEnabled) {
	            validateSOFD().then(() => {
	            	validateOS2Sync().then(() => {
                        const status = $('#os2syncResult').data('result');
                        mapStatusToIcon(status, 'os2sync');
                    });

	            	// when performing a user-self-lookup, we need to get the userId before we do anything else 
	            	if (findUserIdFirst) {
	            		validateTheRest();
	            	}
					
                    const status = $('#sofdResult').data('result');
                    mapStatusToIcon(status, 'sofd');
                })
            }

        	if (!findUserIdFirst) {
				validateTheRest();
        	}
        });
    
    	function validateTheRest() {
        	if (rcEnabled) {
				validateRC().then(() => {
                    const status = $('#rcResult').data('result');
                    mapStatusToIcon(status, 'rc');
                });
        	}
        	
        	if (adEnabled) {
	            validateAD().then(() => {
                    const status = $('#adResult').data('result');
                    mapStatusToIcon(status, 'ad');
					
					if (entraEnabled) {
					    validateEntra().then(() => {
					        const status = $('#entraResult').data('result');
					        mapStatusToIcon(status, 'entra');
					    })
					}
                });
        	}
        	
        	if (nexusEnabled) {
        		validateNexus().then(() => {
                    const status = $('#nexusResult').data('result');
                    mapStatusToIcon(status, 'nexus');
                });
        	}
        	
        	if (os2faktorEnabled) {
        		validateOS2faktor().then(() => {
                    const status = $('#os2faktorResult').data('result');
                    mapStatusToIcon(status, 'os2faktor');
                });
        	}
    	}

        function createTab(tabName, title, active, callback) {
            $('#tab-list').append($('<li><a class="nav-link' + (active ? ' active': '') +'" id="nav-' + tabName + '-tab" data-toggle="tab" data-target="#nav-' + tabName + '" role="tab" aria-controls="nav-' + tabName + '" aria-selected="true" style="display: none;">' + title + '<em class="loading"><i class="fa fa-circle-o-notch fa-spin fa-fw ml-1"></i><span class="sr-only">Loading...</span></em><em id="nav-' + tabName + '-tab-status" class="fa fa-fw fa-check-circle" style="color: black; display: none; margin-left: 5px;"></em></a></li>'));
            $('#tab-content').append($('<div class="tab-pane fade" id="nav-' + tabName + '" role="tabpanel" aria-labelledby="nav-' + tabName + '-tab"></div>'));

			if (callback) {
                callback();
            }
        }

        // TODO: this should resolve true or false so that we know if we should try to call os2sync or not
        function validateSOFD() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Trigger SOFD validation
                    createTab('sofd', "OS2sofd", true, () => {
                        $('#validation-results').getThen('/validate/sofd').then((htmlContent) => {
                            // Remove skeleton tab
                            $('#skeleton-tab-sofd').replaceWith($('#nav-sofd-tab'));
                            $('#nav-sofd-tab').show();

                            $('#validation-results').append($(htmlContent).find('.validation-status'));
                            $('#nav-sofd').html($(htmlContent).find('.validation-data'));

                            // Remove loading spinner
                            $('#nav-sofd-tab > em.loading').remove();

                            // If the loaded tab is the current tab then reload it
                            if ($("#tab-list a.active").attr('id') == 'nav-sofd-tab') {
                                $('#nav-sofd-tab').tab('show');
                                $('#nav-sofd').addClass("active show");
                            }
                            resolve()
                        });
                    });
                }, 1);
            });
        }

        function validateRC() {
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Trigger RoleCatalog validation
                    createTab('rc', "OS2rollekatalog", false, () => {

                        $('#validation-results').getThen('/validate/rc').then((htmlContent) => {
                            // Remove skeleton tab
                            $('#skeleton-tab-rc').replaceWith($('#nav-rc-tab'));
                            $('#nav-rc-tab').show();

                            $('#validation-results').append($(htmlContent).find('.validation-status'));
                            $('#nav-rc').html($(htmlContent).find('.validation-data'));

                            // Remove loading spinner
                            $('#nav-rc-tab > em.loading').remove();
                            
                            //Reload datatables
                            loadDataTables();

                            // If the loaded tab is the current tab then reload it
                            if ($("#tab-list a.active").attr('id') == 'nav-rc-tab') {
                                $('#nav-rc-tab').tab('show');
                                $('#nav-rc').addClass("active show");
                            }
                            resolve()
                        });
                    });
                }, 1);
            });
        }

        }

		                        $('#nav-nexus-tab').tab('show');

		                    }
		                    resolve()

		    });
		}

        function validateEntra() {
            return new Promise(resolve => {
                setTimeout(() => {
                    createTab('entra', 'EntraID', false, () => {
		                $('#validation-results').getThen('/validate/entra').then((htmlContent) => {
		                    // Remove skeleton tab
		                    $('#skeleton-tab-entra').replaceWith($('#nav-entra-tab'));
		                    $('#nav-entra-tab').show();

		                    $('#validation-results').append($(htmlContent).find('.validation-status'));
		                    $('#nav-entra').html($(htmlContent).find('.validation-data'));

		                    // Remove loading spinner
		                    $('#nav-entra-tab > em.loading').remove();

		                    // If the loaded tab is the current tab then reload it
		                    if ($("#tab-list a.active").attr('id') == 'nav-entra-tab') {
		                        $('#nav-entra-tab').tab('show');
		                        $('#nav-entra').addClass("active show");
		                    }
                            resolve();
		                });
                    });
                }, 1);
            });
        }

        function mapStatusToIcon(status, origin) {
            if (status === "danger") {
                $('#nav-' + origin + '-tab-status').attr('class', "fa fa-exclamation-circle")
                $('#nav-' + origin + '-tab-status').css("color", "red");
                $('#nav-' + origin + '-tab-status').css("display", "inline");
            }
            if (status === "success") {
                $('#' + origin + 'ValidationStatus').hide();
                $('#nav-' + origin + '-tab-status').css("color", "green");
                $('#nav-' + origin + '-tab-status').css("display", "inline");
            }
            if (status === "warning") {
                $('#nav-' + origin + '-tab-status').attr('class', "fa fa-exclamation-circle")
                $('#nav-' + origin + '-tab-status').css("color", "orange");
                $('#nav-' + origin + '-tab-status').css("display", "inline");
            }
        }

        /*]]>*/
    </script>

</body>
</html>
