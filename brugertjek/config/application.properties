# dev settings
spring.thymeleaf.cache=false
spring.messages.cache-duration=1

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/brugertjek?useSSL=false&serverTimezone=Europe/Copenhagen
spring.datasource.username=root
spring.datasource.password=Test1234

### SSL ###
server.ssl.enabled=true
server.ssl.key-store=config/ssl-dev.pfx
server.ssl.key-store-password=Test1234
server.ssl.key-password=Test1234

### SAML-Module config ###
di.saml.sp.entityId=https://brugertjek:8844
di.saml.sp.baseUrl=https://brugertjek:8844
di.saml.keystore.location=config/samlKeystore.pfx
di.saml.keystore.password=Test1234
di.saml.idp.metadataLocation=url:https://login-idp.digital-identity.dk/sso/saml/metadata

brugertjek.opsapi.apikey=Test1234

# set to false to test actual integration here
brugertjek.devmode.sofdDevMode=false
brugertjek.devmode.rcDevMode=true
brugertjek.devmode.adDevMode=false
brugertjek.devmode.nexusDevMode=false
brugertjek.devmode.os2faktorDevMode=false
brugertjek.devmode.os2syncDevMode=false

# disable framework-activedirectory during development
framework.ad.devMode=true
